<html lang="pt-BR">
<head>

    <style>
        /* --- CSS --- */
        :root {
            --primary: #6366f1; /* Indigo */
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --accent-green: #22c55e;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        /* Header */
        header {
            background: var(--card-bg);
            padding: 1.5rem 2rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
        .logo span { color: var(--text-main); }

        /* Search Bar */
        .search-container { flex: 1; max-width: 400px; position: relative; }
        .search-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-size: 0.95rem;
            transition: 0.3s;
            outline: none;
        }
        .search-input:focus { border-color: var(--primary); }

        /* Container Principal */
        main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        
        .section-title { margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: 600; }

        /* Grid de Produtos */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
        }

        /* Cartão do Produto */
        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }

        .badge-discount {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent-green);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .image-container {
            width: 100%;
            height: 200px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        .info { padding: 1.5rem; display: flex; flex-direction: column; flex: 1; }

        .category { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; margin-bottom: 0.5rem; }
        
        .title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .prices { margin-top: auto; padding-top: 1rem; }
        .old-price { font-size: 0.9rem; text-decoration: line-through; color: var(--text-secondary); }
        .new-price { font-size: 1.5rem; font-weight: 700; color: var(--primary); }

        .btn-buy {
            display: block;
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
            background: var(--primary);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn-buy:hover { background: var(--primary-hover); }

        /* Footer */
        footer { text-align: center; padding: 2rem; color: var(--text-secondary); margin-top: 3rem; font-size: 0.9rem; border-top: 1px solid #e2e8f0; }

        /* Mensagem "Não encontrado" */
        .no-results { grid-column: 1 / -1; text-align: center; padding: 2rem; color: var(--text-secondary); font-size: 1.1rem; }
    </style>
</head>
